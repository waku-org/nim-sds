name: ci / nimble
permissions:
  contents: read
on:
  pull_request:
    branches: [master, release/*]
  push:
    branches: [master, release/*]
  workflow_dispatch:

jobs:
  test:
    name: 'test / ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test suite
        run: nimble test

  build:
    name: '${{ matrix.name }} / ${{ matrix.task }}'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, runs-on: ubuntu-latest, task: libsdsDynamicLinux }
          - { name: linux, runs-on: ubuntu-latest, task: libsdsStaticLinux }
          - { name: macos, runs-on: macos-latest, task: libsdsDynamicMac }
          - { name: macos, runs-on: macos-latest, task: libsdsStaticMac }
          - { name: windows, runs-on: windows-latest, task: libsdsDynamicWindows }
          - { name: windows, runs-on: windows-latest, task: libsdsStaticWindows }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.task }}
        run: nimble ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}
          path: build/

  build-ios:
    name: 'macos / libsdsIOS'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # 'latest-stable' tracks whatever the macos-latest runner ships, so
          # this survives Xcode rotations (the runner dropped 16.2 for 26.x).
          xcode-version: 'latest-stable'

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libsdsIOS
        run: nimble libsdsIOS

      - uses: actions/upload-artifact@v4
        with:
          name: libsdsIOS
          path: build/

  build-android:
    name: 'linux / ${{ matrix.task }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [libsdsAndroidArm64, libsdsAndroidAmd64, libsdsAndroidX86]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nimble
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build ${{ matrix.task }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: nimble ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}
          path: build/
